name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-dev build-essential git \
            autoconf automake libtool libffi-dev cmake libssl-dev libltdl-dev \
            openjdk-11-jdk zip unzip

      - name: Install Buildozer
        run: pip install buildozer

      - name: Build APK
        env:
          BUILDOZER_ALLOW_ROOT: '1'
          ANDROID_SDK_ACCEPT_LICENSES: '1'
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jawtracker-apk
          path: bin/*.apk
